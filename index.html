<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takt</title>
<meta name="description" content="Takt — a simple rhythm trainer for iPhone.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #ffffff; --ink: #17151f; --muted: #6b6878; --accent: #6c4ee0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0c16; --ink: #f1eff7; --muted: #a29fb2; --accent: #a993ff; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 20px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { font-size: 34px; margin: 18px 0 4px; }
  p { color: var(--muted); margin: 4px 0; }
  .links { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Takt app icon">
  <h1>Takt</h1>
  <p>A simple rhythm trainer for iPhone.</p>
  <p>Простой тренажёр ритма для iPhone.</p>
  <div class="links">
    <a href="privacy/#en">Privacy Policy</a>
    <a href="privacy/#ru">Политика конфиденциальности</a>
    <a href="mailto:e.atazhanov@icloud.com">e.atazhanov@icloud.com</a>
  </div>
</main>
</body>
</html>
